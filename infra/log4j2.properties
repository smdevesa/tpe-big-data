rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd'T'HH:mm:ss'Z'}{UTC} | %-7p | %-24c{1} | %m%n

logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error

logger.streamwrite.name = org.apache.spark.sql.execution.streaming.runtime.ResolveWriteToStream
logger.streamwrite.level = error

logger.microbatch.name = org.apache.spark.sql.execution.streaming.runtime.MicroBatchExecution
logger.microbatch.level = error

logger.parquetmemory.name = org.apache.parquet.hadoop.MemoryManager
logger.parquetmemory.level = error
